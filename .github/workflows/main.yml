name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}-debug
          name: "حسابدار من - Debug Build #${{ github.run_number }}"
          body: |
            🚀 **نسخه Debug APK**
            
            ✅ این نسخه برای تست روی دستگاه‌های Android است
            
            📲 برای نصب:
            1. فایل APK را دانلود کنید
            2. روی دستگاه Android منتقل کنید
            3. دو‌بار روی فایل ضربه بزنید و نصب را تایید کنید
            
            ⚠️ توجه: این نسخه release نیست، تنها برای تست است
            
            📝 تغییرات: https://github.com/${{ github.repository }}/commits/${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: success()

