- name: Setup Android SDK manually
  run: |
    export ANDROID_HOME=${HOME}/android-sdk
    export PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}
    mkdir -p ${ANDROID_HOME}/cmdline-tools
    
    # دانلود و نصب Command Line Tools
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdline-tools.zip
    unzip -q cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools
    mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
    
    # تأیید لایسنس‌ها (خطاها را نشان بده)
    echo "Accepting licenses..."
    yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || { echo "License acceptance failed"; exit 1; }
    
    # نصب حداقل مورد نیاز (خطاها را نشان بده)
    echo "Installing SDK components..."
    ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" --verbose || { echo "SDK installation failed"; exit 1; }
    
    # ذخیره مسیرها
    echo "ANDROID_HOME=${HOME}/android-sdk" >> $GITHUB_ENV
    echo "${HOME}/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
    echo "${HOME}/android-sdk/platform-tools" >> $GITHUB_PATH
    
    echo "Android SDK installed successfully"
