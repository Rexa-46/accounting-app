- name: Setup Android SDK manually
  run: |
    export ANDROID_HOME="/home/runner/android-sdk"
    export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
    
    mkdir -p ${ANDROID_HOME}/cmdline-tools
    
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdline-tools.zip
    unzip -q cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools
    mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
    
    echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
    ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" > /dev/null 2>&1
    
    echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
    echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
    echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
